<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D5372A">
<meta name="description" content="힌트를 읽고 포켓몬 이름을 맞혀 전국도감 802칸을 채우는 읽기 연습 게임.">
<title>포켓몬 도감 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="masthead">
  <span class="mast-mark" aria-hidden="true"></span>
  <h1 class="mast-title" id="mast-title">포켓몬 도감 퀴즈</h1>
  <button class="mast-btn" id="btn-sound">소리 끄기</button>
  <button class="mast-btn mast-btn--warn" id="btn-reset">초기화</button>
  <button class="mast-btn is-hidden" id="btn-back">처음으로</button>
</header>

<main id="screens">

  <!-- ============ 처음 시작: 캐릭터와 이름 정하기 ============ -->
  <section class="screen" id="screen-setup">
    <div class="scroll">
      <p class="rule">누구로 할까?</p>
      <div class="trainer-grid" id="trainer-grid"></div>

      <p class="rule">이름을 써 줘</p>
      <input class="setup-input" id="setup-name" type="text" maxlength="8"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="내 이름" aria-label="내 이름">
      <p class="setup-hint" id="setup-hint">캐릭터를 고르고 이름을 쓰면 시작할 수 있어.</p>

      <div class="setup-buttons">
        <button class="cta" id="setup-go">시작하기</button>
        <button class="menu-row is-hidden" id="setup-cancel">
          <span class="menu-label">그만두기</span>
        </button>
      </div>
      <div style="height:14px"></div>
    </div>
  </section>

  <!-- ============ 홈 ============ -->
  <section class="screen is-on" id="screen-home">
    <div class="scroll">

      <div class="hero">
        <div class="hero-top">
          <button class="hero-me" id="hero-me" title="내 캐릭터 바꾸기">
            <img class="hero-me-img" id="hero-trainer" alt="내 캐릭터">
            <span class="hero-me-name" id="hero-name"></span>
          </button>
          <div class="hero-text">
            <p class="hero-eyebrow" id="rank-step">전국도감 001 — 802</p>
            <h2 class="hero-title" id="rank-title">시작 트레이너</h2>
            <div class="rank-bar" id="rank-bar"><i id="rank-fill"></i></div>
            <p class="rank-next" id="rank-next"></p>
          </div>
        </div>
        <div class="badgecase" id="badgecase">
          <p class="badgecase-head">
            <span>내 배지</span><span id="badgecase-count"></span>
          </p>
          <div class="badgecase-row" id="badgecase-row"></div>
        </div>
        <div class="mosaic" id="mosaic" aria-label="도감 802칸 진행 상황"></div>
        <p class="hero-caption" id="mosaic-caption"></p>
      </div>

      <button class="cta" id="btn-play">아무 포켓몬이나 풀기</button>

      <p class="rule">다른 놀이</p>
      <div class="menu">
        <button class="menu-row" id="btn-sentence">
          <span class="menu-label">문장 맞추기</span>
          <span class="menu-meta" id="menu-sent-count"></span>
        </button>
      </div>

      <p class="rule">타입 골라 풀기</p>
      <div class="type-grid" id="type-list"></div>

      <p class="rule">더 보기</p>
      <div class="menu">
        <button class="menu-row" id="btn-dex">
          <span class="menu-label">내 도감</span>
          <span class="menu-meta" id="menu-dex-count"></span>
        </button>
        <button class="menu-row" id="btn-badge">
          <span class="menu-label">배지와 기록</span>
          <span class="menu-meta" id="menu-badge-count"></span>
        </button>
      </div>

      <p class="colophon">포켓몬 자료 출처 PokéAPI · 책 《포켓몬스터 썬&amp;문 포켓몬 전국대도감》과 함께 쓰는 놀이</p>
    </div>
  </section>

  <!-- ============ 퀴즈 ============ -->
  <section class="screen" id="screen-quiz">
    <div class="quiz-bar">
      <span class="quiz-where" id="quiz-region">관동</span>
      <span class="quiz-count" id="quiz-progress">0 / 151</span>
      <span class="tries" id="quiz-lives" aria-label="남은 기회"></span>
    </div>

    <div class="quiz-scroll" id="quiz-body">
      <div class="plate" id="plate">
        <span class="plate-no" id="plate-no">No. ???</span>
        <span class="plate-q" id="plate-q" aria-hidden="true">?</span>
        <img class="plate-art" id="plate-art" alt="" aria-hidden="true">
        <span class="plate-types" id="plate-types"></span>
      </div>

      <p class="rule rule--tight">단서</p>
      <div class="clues" id="hints"></div>
      <button class="gate" id="hint-gate" type="button" disabled>
        <span class="gate-label" id="hint-gate-label"></span>
        <i class="gate-bar"><b id="hint-gate-bar"></b></i>
      </button>
      <div class="clues" id="hints-more"></div>
    </div>

    <div class="answer">
      <div class="slots" id="slots" aria-label="이름 넣는 칸"></div>
      <div class="tiles" id="tiles" aria-label="글자 고르기"></div>
    </div>
  </section>

  <!-- ============ 문장 조립 ============ -->
  <section class="screen" id="screen-sentence">
    <div class="quiz-bar">
      <span class="quiz-where" id="sent-name">이야기</span>
      <span class="quiz-count" id="sent-count">0문장</span>
      <span class="tries" id="sent-lives" aria-label="남은 기회"></span>
    </div>

    <div class="quiz-scroll" id="sent-body">
      <img class="sent-art" id="sent-art" alt="">
      <div class="sent-work">
        <p class="sent-hint" id="sent-hint">낱말을 순서대로 눌러 문장을 만들어 봐.</p>
        <div class="wslots" id="sent-slots" aria-label="문장 만드는 칸"></div>
        <button class="later is-hidden" id="sent-later" type="button">다음에 하기</button>
      </div>
    </div>

    <div class="answer">
      <div class="wtiles" id="sent-tiles" aria-label="낱말 고르기"></div>
    </div>
  </section>

  <!-- ============ 책이랑 찾기 ============ -->

  <!-- ============ 도감 ============ -->
  <section class="screen" id="screen-dex">
    <div class="tabs" id="dex-tabs"></div>
    <p class="dex-line" id="dex-progress"></p>
    <div class="scroll">
      <div class="dex-grid" id="dex-grid"></div>
    </div>
  </section>

  <!-- ============ 배지와 기록 ============ -->
  <section class="screen" id="screen-badge">
    <div class="scroll">
      <p class="rule">기록</p>
      <div class="stats" id="stat-row"></div>

      <p class="rule">배지</p>
      <div class="badges" id="badge-grid"></div>

      <p class="rule">내 캐릭터</p>
      <button class="menu-row" id="btn-profile">
        <span class="menu-label">캐릭터와 이름 바꾸기</span>
        <span class="menu-meta" id="profile-meta"></span>
      </button>
    </div>
  </section>

  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
  <div class="booting" id="loading">도감을 펴고 있어요</div>
</main>

<script src="data/pokedex.js"></script>
<script src="data/book-pages.js"></script>
<script src="js/lock.js"></script>
<script src="js/util.js"></script>
<script src="js/save.js"></script>
<script src="js/data.js"></script>
<script src="js/dex.js"></script>
<script src="js/write.js"></script>
<script src="js/catch.js"></script>
<script src="js/sentence.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
